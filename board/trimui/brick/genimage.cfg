image boot.vfat {
	vfat {
		file brick-bootcount { image = "brick-bootcount.good" }
		file brick-diag/manifest.json { image = "payload-manifest.json" }
		file brick-diag/SHA256SUMS { image = "payload-SHA256SUMS" }
		file brick-diag/Image { image = "Image" }
		file brick-diag/brick-usb.dtb { image = "sun50i-a133-trimui-brick.dtb" }
	}
	# Kernel/DT slots and FAT allocation headroom. The product root lives on
	# ext4 so U-Boot does not preload hundreds of MiB before Linux starts.
	size = 252M
}
image data.ext4 {
	ext4 {
		use-mke2fs = true
		label = "brick-data"
	}
	empty = true
	size = 64M
}
image sdcard.img {
	hdimage { }
	partition spl {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
		size = 3968K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}
	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 256M
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
		offset = 704M
	}

}
