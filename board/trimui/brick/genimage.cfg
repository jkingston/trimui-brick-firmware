image boot.vfat {
	vfat {
		file brick-diag/Image { image = "Image" }
		file brick-diag/brick-usb.dtb { image = "sun50i-a133-trimui-brick.dtb" }
		file brick-diag/initramfs.cpio.gz { image = "rootfs.cpio.gz" }
	}
	size = 124M
}
image sdcard.img {
	hdimage { }
	partition spl {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
		size = 3968K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}
}
